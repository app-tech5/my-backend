name: CI

on:
  # Tests on PRs / local feature branch only — NOT on features-online
  # (features-online push runs Deploy backend alone).
  push:
    branches: [features-local-clean]
  pull_request:
    branches: [features-online, features-local-clean]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_DRIVERS_GEO_KEY: drivers:geo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install (not ci): allows new package.json deps like redis
      # without requiring a locally-generated package-lock update on Mac.
      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test:ci

name: Deploy backend

on:
  push:
    branches: [features-online]
  workflow_dispatch:

env:
  VPS_APP_PATH: /root/my-backend
  VPS_PM2_NAME: my-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          LICENSE_INQUIRY_TO: ${{ secrets.LICENSE_INQUIRY_TO }}
          LICENSE_INQUIRY_FROM: ${{ secrets.LICENSE_INQUIRY_FROM }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: STRIPE_SECRET_KEY,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,LICENSE_INQUIRY_TO,LICENSE_INQUIRY_FROM
          # IMPORTANT: script_stop must stay false.
          # When true, appleboy injects "exit if $? != 0" after EVERY line,
          # which kills multi-line if/elif/functions (e.g. grep no-match).
          script_stop: false
          script: |
            set -eo pipefail
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd "${{ env.VPS_APP_PATH }}"

            sync_env() {
              key="$1"
              value="$2"
              if [ -z "$value" ]; then
                echo "[sync_env] skip ${key} (empty)"
                return 0
              fi
              touch .env
              grep -v "^${key}=" .env > .env.tmp || true
              printf '%s=%s\n' "$key" "$value" >> .env.tmp
              mv .env.tmp .env
              echo "[sync_env] ok ${key} (length=${#value})"
            }

            OLD_SHA=$(git rev-parse HEAD)

            echo "=== 1/5 git fetch + reset ==="
            git fetch origin features-online
            git checkout features-online
            git reset --hard origin/features-online

            NEW_SHA=$(git rev-parse HEAD)
            echo "SHA ${OLD_SHA} -> ${NEW_SHA}"
            CHANGED_FILES=""
            if [ "$OLD_SHA" != "$NEW_SHA" ]; then
              CHANGED_FILES=$(git diff --name-only "$OLD_SHA" "$NEW_SHA" || true)
            fi

            NEED_NPM=0
            NEED_MIGRATE=0
            case "$CHANGED_FILES" in
              *package.json*|*package-lock.json*) NEED_NPM=1 ;;
            esac
            case "$CHANGED_FILES" in
              *migrations/*) NEED_MIGRATE=1 ;;
            esac

            echo "=== 2/5 sync secrets to .env ==="
            sync_env STRIPE_SECRET_KEY "${STRIPE_SECRET_KEY:-}"
            sync_env SMTP_HOST "${SMTP_HOST:-}"
            sync_env SMTP_PORT "${SMTP_PORT:-}"
            sync_env SMTP_USER "${SMTP_USER:-}"
            sync_env SMTP_PASS "${SMTP_PASS:-}"
            sync_env LICENSE_INQUIRY_TO "${LICENSE_INQUIRY_TO:-}"
            sync_env LICENSE_INQUIRY_FROM "${LICENSE_INQUIRY_FROM:-}"

            echo "=== 3/5 npm ci (only if deps changed) ==="
            if [ "$OLD_SHA" = "$NEW_SHA" ]; then
              echo "No new commits - skip npm ci"
            elif [ "$NEED_NPM" = "1" ]; then
              npm ci
            else
              echo "package.json / package-lock.json unchanged - skip npm ci"
            fi

            echo "=== 4/5 migrate (only if migrations changed) ==="
            if [ "$OLD_SHA" = "$NEW_SHA" ]; then
              echo "No new commits - skip migrate"
            elif [ "$NEED_MIGRATE" = "1" ]; then
              npm run migrate:up
            else
              echo "migrations/ unchanged - skip migrate"
            fi

            echo "=== 5/5 pm2 restart ==="
            if [ "$OLD_SHA" = "$NEW_SHA" ]; then
              echo "No new commits - skip pm2 restart"
            else
              pm2 restart "${{ env.VPS_PM2_NAME }}"
            fi

            echo "=== deploy done ==="

name: Deploy backend

on:
  push:
    branches: [features-online]
  workflow_dispatch:

env:
  VPS_APP_PATH: /root/my-backend
  VPS_PM2_NAME: my-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: STRIPE_SECRET_KEY
          script_stop: true
          script: |
            set -eo pipefail
            set -x
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd "${{ env.VPS_APP_PATH }}"

            sync_env() {
              key="$1"
              value="$2"
              echo "[sync_env] key=${key} value_length=${#value}"
              [ -n "$value" ] || { echo "[sync_env] skip (empty value)"; return 0; }
              touch .env
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
                echo "[sync_env] updated existing ${key}"
              else
                echo "${key}=${value}" >> .env
                echo "[sync_env] appended ${key}"
              fi
            }

            echo "=== 1/5 git fetch ==="
            git fetch origin features-online

            echo "=== 2/5 git reset ==="
            git reset --hard origin/features-online

            echo "=== 3/5 sync STRIPE_SECRET_KEY ==="
            if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
              echo "[warn] STRIPE_SECRET_KEY not set in GitHub Secrets"
            else
              echo "[info] STRIPE_SECRET_KEY received (length=${#STRIPE_SECRET_KEY})"
            fi
            sync_env STRIPE_SECRET_KEY "${STRIPE_SECRET_KEY:-}" || { echo "[error] sync_env failed with exit $?"; exit 1; }

            echo "=== 4/5 npm ci + migrate ==="
            npm ci
            npm run migrate:up

            echo "=== 5/5 pm2 restart ==="
            pm2 restart "${{ env.VPS_PM2_NAME }}"

            echo "=== deploy done ==="

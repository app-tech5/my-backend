name: Deploy backend

on:
  push:
    branches: [features-online]
  workflow_dispatch:

env:
  VPS_APP_PATH: /root/my-backend
  VPS_PM2_NAME: my-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: STRIPE_SECRET_KEY
          script_stop: true
          script: |
            set -eo pipefail
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd "${{ env.VPS_APP_PATH }}"

            sync_env() {
              key="$1"
              value="$2"
              if [ -z "$value" ]; then
                echo "[sync_env] skip ${key} (empty)"
                return 0
              fi
              touch .env
              grep -v "^${key}=" .env > .env.tmp || true
              printf '%s=%s\n' "$key" "$value" >> .env.tmp
              mv .env.tmp .env
              echo "[sync_env] ok ${key} (length=${#value})"
            }

            OLD_SHA=$(git rev-parse HEAD)

            echo "=== 1/5 git pull ==="
            git fetch origin features-online
            git checkout features-online
            git pull --ff-only origin features-online

            NEW_SHA=$(git rev-parse HEAD)
            echo "SHA ${OLD_SHA} -> ${NEW_SHA}"

            echo "=== 2/5 sync STRIPE_SECRET_KEY ==="
            sync_env STRIPE_SECRET_KEY "${STRIPE_SECRET_KEY:-}"

            echo "=== 3/5 npm install (only if deps changed) ==="
            if [ "$OLD_SHA" = "$NEW_SHA" ]; then
              echo "No new commits — skip npm install"
            elif git diff --name-only "$OLD_SHA" "$NEW_SHA" | grep -qE '^package(-lock)?\.json$'; then
              npm install
            else
              echo "package.json / package-lock.json unchanged — skip npm install"
            fi

            echo "=== 4/5 migrate (only if migrations changed) ==="
            if [ "$OLD_SHA" = "$NEW_SHA" ]; then
              echo "No new commits — skip migrate"
            elif git diff --name-only "$OLD_SHA" "$NEW_SHA" | grep -qE '^migrations/'; then
              npm run migrate:up
            else
              echo "migrations/ unchanged — skip migrate"
            fi

            echo "=== 5/5 pm2 restart ==="
            if [ "$OLD_SHA" = "$NEW_SHA" ]; then
              echo "No new commits — skip pm2 restart"
            else
              pm2 restart "${{ env.VPS_PM2_NAME }}"
            fi

            echo "=== deploy done ==="

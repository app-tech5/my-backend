name: Deploy backend

on:
  push:
    branches: [features-online]
  workflow_dispatch:

env:
  VPS_APP_PATH: /root/my-backend
  VPS_PM2_NAME: my-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd "${{ env.VPS_APP_PATH }}"
            git fetch origin features-online
            git reset --hard origin/features-online
            npm ci --omit=dev
            npm run migrate:up
            pm2 restart "${{ env.VPS_PM2_NAME }}"
